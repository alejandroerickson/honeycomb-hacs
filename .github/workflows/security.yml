name: Security

# Weekly, and on demand: every published commit checked again for anything private
# (okf/operations/security-checks.md). A failure reports; it does not block.
on:
  schedule:
    - cron: "23 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Nothing private, every published commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python3 scripts/check_publishable.py --all
